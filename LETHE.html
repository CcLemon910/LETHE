<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>LETHE</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:       #060606;
  --fg:       rgba(255,255,255,0.82);
  --fg-dim:   rgba(255,255,255,0.28);
  --fg-faint: rgba(255,255,255,0.09);
  --post-w:   288px;
  --photo-h:  360px;
  --gap:      52px;
}

html, body {
  width: 100%; height: 100%;
  background: var(--bg);
  overflow: hidden;
  font-family: 'DM Sans', -apple-system, sans-serif;
  color: var(--fg);
}

/* ── Feed ── */
#viewport { position: fixed; inset: 0; overflow: hidden; }

#track {
  position: absolute;
  left: 50%;
  top: 0;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--gap);
  padding: 80px 0;
  will-change: transform;
}

/* ── Post ── */
.post { width: var(--post-w); flex-shrink: 0; position: relative; }

.post-photo {
  width: var(--post-w);
  height: var(--photo-h);
  position: relative;
  overflow: hidden;
  background: #111;
}

.post-photo img {
  width: 100%; height: 100%;
  object-fit: cover; display: block;
  user-select: none; -webkit-user-drag: none;
}

/* 消融 canvas 覆蓋在照片上 */
.post-photo canvas {
  position: absolute; inset: 0; pointer-events: none;
}

/* 底部漸層陰影讓文字更易讀 */
.post-photo::after {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(to bottom, transparent 55%, rgba(6,6,6,0.28) 100%);
  pointer-events: none;
}

.post-body { padding: 13px 2px 0 2px; }

.post-caption {
  font-size: 13px;
  font-weight: 300;
  line-height: 1.72;
  color: var(--fg);
  letter-spacing: 0.01em;
  min-height: 22px;
}

.post-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 9px;
}

.post-time {
  font-size: 9px;
  font-weight: 400;
  color: var(--fg-dim);
  letter-spacing: 0.13em;
  text-transform: uppercase;
}

.post-dot {
  width: 4px; height: 4px;
  border-radius: 50%;
  background: var(--fg-faint);
}
.post-dot.triggered { background: rgba(255,255,255,0.20); }

/* ── 邊緣淡出 ── */
#fade-top, #fade-bottom {
  position: fixed; left: 0; right: 0; height: 110px;
  z-index: 5; pointer-events: none;
}
#fade-top    { top: 0;    background: linear-gradient(to bottom, var(--bg), transparent); }
#fade-bottom { bottom: 0; background: linear-gradient(to top,   var(--bg), transparent); }

/* ── 品牌字 ── */
#brand {
  position: fixed; bottom: 22px; left: 26px;
  font-family: 'DM Serif Display', serif;
  font-style: italic; font-size: 11px;
  color: var(--fg-faint); letter-spacing: 0.22em;
  z-index: 10; pointer-events: none; user-select: none;
}

/* ── 空狀態 ── */
#empty {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 10px;
  opacity: 0; transition: opacity 1.2s; pointer-events: none;
}
#empty.visible { opacity: 1; }
#empty .e-title {
  font-family: 'DM Serif Display', serif; font-style: italic;
  font-size: 17px; color: var(--fg-faint); letter-spacing: 0.15em;
}
#empty .e-sub {
  font-size: 9px; color: rgba(255,255,255,0.05);
  letter-spacing: 0.25em; text-transform: uppercase;
}
</style>
</head>
<body>

<div id="fade-top"></div>
<div id="fade-bottom"></div>
<div id="viewport"><div id="track"></div></div>
<div id="brand">LETHE</div>
<div id="empty">
  <div class="e-title">nothing recorded</div>
  <div class="e-sub">waiting</div>
</div>

<script>
// ══════════════════════════════════════
// 設定
// ══════════════════════════════════════
const SCROLL_SPEED      = 0.38;   // px/frame
const POLL_MS           = 5000;
const GAP               = 52;     // px，對應 CSS gap
const DISSOLVE_START_MS = 28000;  // 28 秒後開始消融
const DISSOLVE_FULL_MS  = 22000;  // 消融持續 22 秒
const TILE              = 7;      // 碎片像素大小
const PHOTO_W           = 288;
const PHOTO_H           = 360;

// IG 打卡文案庫（28句，隨機分配）
const CAPTIONS = [
  "今天也是很棒的一天",
  "活在當下，不想太多",
  "有些事說不出口，但心裡有數",
  "把每一刻都留住",
  "這一秒，就這樣了",
  "還好有記錄下來",
  "不知道為什麼但就是喜歡",
  "感謝今天的自己",
  "有些瞬間只屬於自己",
  "就算沒有人懂也沒關係",
  "這種感覺說不上來",
  "記得這個表情",
  "又是新的一天",
  "喜歡這樣的我",
  "某個平凡的下午",
  "把這一刻放進心裡",
  "不特別但很喜歡",
  "剛好而已",
  "記錄一下",
  "這樣就夠了",
  "留著以後回來看",
  "有被愛到",
  "今天也辛苦了",
  "一切都剛剛好",
  "說不出原因的滿足",
  "這個瞬間屬於我",
  "存在就是意義",
  "某種說不清楚的感覺",
];

function pickCaption() {
  return CAPTIONS[Math.floor(Math.random() * CAPTIONS.length)];
}

// ══════════════════════════════════════
// 狀態
// ══════════════════════════════════════
const track      = document.getElementById('track');
const empty      = document.getElementById('empty');
let trackY       = 0;
let knownIds     = new Set();
let dissolved    = new Set();   // 已消融，不再重新加入
let postStates   = new Map();   // id → state 物件

// ══════════════════════════════════════
// 工具函式
// ══════════════════════════════════════
function makeId(p) { return p.id || p.time; }

function formatTime(s) {
  try {
    const [d, t] = s.split(' ');
    const [y, m, dd] = d.split('-');
    return `${y} / ${parseInt(m)} / ${parseInt(dd)}  —  ${t}`;
  } catch(e) { return s; }
}

function updateEmpty() {
  if (track.children.length === 0) empty.classList.add('visible');
  else empty.classList.remove('visible');
}

// ══════════════════════════════════════
// 建立 DOM 元素
// ══════════════════════════════════════
function createPost(p) {
  const id   = makeId(p);
  const type = p.type || 'triggered';

  const div = document.createElement('div');
  div.className = 'post';
  div.dataset.id = id;

  // 照片
  const photo = document.createElement('div');
  photo.className = 'post-photo';
  const img = document.createElement('img');
  img.src = p.src; img.alt = ''; img.loading = 'lazy'; img.draggable = false;
  photo.appendChild(img);

  let dissolveCanvas = null;
  if (type === 'auto') {
    dissolveCanvas = document.createElement('canvas');
    dissolveCanvas.width  = PHOTO_W;
    dissolveCanvas.height = PHOTO_H;
    photo.appendChild(dissolveCanvas);
  }
  div.appendChild(photo);

  // 文字
  const body = document.createElement('div');
  body.className = 'post-body';

  const cap = document.createElement('div');
  cap.className = 'post-caption';
  cap.textContent = p.caption || pickCaption();
  body.appendChild(cap);

  const meta = document.createElement('div');
  meta.className = 'post-meta';
  const ts  = document.createElement('div');
  ts.className = 'post-time';
  ts.textContent = formatTime(p.time);
  meta.appendChild(ts);
  const dot = document.createElement('div');
  dot.className = 'post-dot' + (type === 'triggered' ? ' triggered' : '');
  meta.appendChild(dot);
  body.appendChild(meta);
  div.appendChild(body);

  // 記錄狀態
  postStates.set(id, {
    el: div, addedAt: Date.now(), type,
    canvas: dissolveCanvas,
    tiles: null, done: false,
  });

  return div;
}

// ══════════════════════════════════════
// 新增貼文
// ══════════════════════════════════════
function addPost(p) {
  const id = makeId(p);
  if (knownIds.has(id) || dissolved.has(id)) return;
  knownIds.add(id);
  track.appendChild(createPost(p));
  updateEmpty();
}

// ══════════════════════════════════════
// 消融效果
// ══════════════════════════════════════
function tickDissolve(id, s) {
  if (s.type !== 'auto' || s.done || !s.canvas) return;

  const elapsed = Date.now() - s.addedAt;
  if (elapsed < DISSOLVE_START_MS) return;

  const progress = Math.min(1, (elapsed - DISSOLVE_START_MS) / DISSOLVE_FULL_MS);
  const ctx  = s.canvas.getContext('2d');
  const cols = Math.ceil(PHOTO_W / TILE);
  const rows = Math.ceil(PHOTO_H / TILE);
  const total = cols * rows;

  // 初始化碎片順序（第一次才做，隨機排列）
  if (!s.tiles) {
    s.tiles = Array.from({ length: total }, (_, i) => i);
    for (let i = s.tiles.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [s.tiles[i], s.tiles[j]] = [s.tiles[j], s.tiles[i]];
    }
  }

  ctx.clearRect(0, 0, PHOTO_W, PHOTO_H);
  ctx.fillStyle = '#060606';
  const hide = Math.floor(progress * total);
  for (let i = 0; i < hide; i++) {
    const idx = s.tiles[i];
    ctx.fillRect((idx % cols) * TILE, Math.floor(idx / cols) * TILE, TILE, TILE);
  }

  if (progress >= 1) {
    s.done = true;
    dissolved.add(id);
    knownIds.delete(id);
    postStates.delete(id);
    const el = s.el;
   // 只讓照片和文字消失，不移除元素，保留空白
    el.style.opacity = '0';
  }
}

// ══════════════════════════════════════
// 主動畫迴圈
// ══════════════════════════════════════
function tick() {
  trackY -= SCROLL_SPEED;

  // 把第一個元素移到最後，形成無縫 loop
  if (track.children.length >= 2) {
    const first = track.children[0];
    const screenBottom = first.offsetTop + first.offsetHeight + trackY;
    if (screenBottom < -(GAP * 1.5)) {
      const compensate = first.offsetHeight + GAP;
      track.appendChild(first);
      trackY += compensate;
    }
  }

  track.style.transform = `translateX(-50%) translateY(${trackY}px)`;
  postStates.forEach((s, id) => tickDissolve(id, s));
  requestAnimationFrame(tick);
}

// ══════════════════════════════════════
// 輪詢後端
// ══════════════════════════════════════
async function poll() {
  try {
    const data = await fetch('/api/photos').then(r => r.json());
    data.forEach(p => addPost(p));
  } catch(e) {}
}

// ══════════════════════════════════════
// 初始化
// ══════════════════════════════════════
(async () => {
  updateEmpty();
  try {
    const data = await fetch('/api/photos').then(r => r.json());
    data.forEach(p => addPost(p));
  } catch(e) {}
  requestAnimationFrame(tick);
  setInterval(poll, POLL_MS);
})();
</script>
</body>
</html>
