<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>LETHE</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@0;1&family=Noto+Sans+TC:wght@300;400&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #000;       /* 背景色，改這裡換背景顏色 */
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  font-family: 'Noto Sans TC', sans-serif;
}

/* ── 粒子畫布 ── */
#particles {
  position: fixed;
  inset: 0;
  pointer-events: none;   /* 粒子不會擋住點擊卡片 */
  z-index: 0;
}

/* ── LETHE 標題（左下角） ── */
#brand {
  position: fixed;
  bottom: 28px;           /* 距離底部距離，改大往上移 */
  left: 32px;             /* 距離左側距離 */
  z-index: 10;
  font-family: 'Playfair Display', serif;
  font-size: 13px;        /* 字體大小 */
  font-style: italic;
  color: rgba(255,255,255,0.12);  /* 透明度 0.12 = 很淡，改大會更明顯，最大 1 */
  letter-spacing: 0.2em;
  user-select: none;
}

/* ── 卡片容器 ── */
#stage {
  position: fixed;
  inset: 0;
  z-index: 1;
}

/* ── 單張卡片外層（負責位置和漂浮） ── */
.card-wrap {
  position: absolute;
  cursor: pointer;
  transform-style: preserve-3d;
  perspective: 800px;     /* 透視距離，越小翻轉效果越誇張 */
}

/* ── 卡片本體（負責翻轉動畫） ── */
.card-inner {
  width: 100%;
  height: 100%;
  position: relative;
  transform-style: preserve-3d;
  transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);  /* 0.7s = 翻轉動畫秒數，改小會更快 */
}

.card-wrap.flipped .card-inner {
  transform: rotateY(180deg);
}

/* ── 正面 / 背面共用 ── */
.card-front, .card-back {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  border-radius: 6px;     /* 卡片圓角，改 0 是直角，改大更圓 */
  overflow: hidden;
}

/* ── 正面：照片 ── */
.card-front {
  background: #111;
  box-shadow:
    0 8px 40px rgba(0,0,0,0.6),           /* 卡片陰影，讓卡片有浮起感 */
    0 0 0 1px rgba(255,255,255,0.06);      /* 卡片邊框，0.06 = 很淡的白邊，改 0 沒有邊框 */
}

.card-front img {
  width: 100%;
  height: 100%;
  object-fit: cover;      /* cover = 照片裁切填滿；contain = 照片完整顯示但可能有黑邊 */
  display: block;
}

.card-front .card-shimmer {
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.04) 0%, transparent 60%);
  /* 卡片正面的光澤感，0.04 = 很淡，改大會更明顯 */
  pointer-events: none;
}

/* ── 背面：時間戳記 ── */
.card-back {
  background: #0a0a0a;    /* 卡片背面背景色 */
  transform: rotateY(180deg);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;              /* 背面各元素之間的間距，改大間距更寬 */
  padding: 20px;
  box-shadow:
    0 8px 40px rgba(0,0,0,0.6),
    0 0 0 1px rgba(255,255,255,0.06);
}

.card-back .back-label {
  font-size: 9px;         /* "recorded at" 的字體大小 */
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.2);  /* "recorded at" 的顏色透明度，改大更明顯 */
}

.card-back .back-date {
  font-family: 'Playfair Display', serif;
  font-size: 15px;        /* 日期字體大小 */
  color: rgba(255,255,255,0.7);  /* 日期顏色透明度，0.7 = 偏亮 */
  text-align: center;
  line-height: 1.6;
}

.card-back .back-time {
  font-size: 11px;        /* 時間字體大小 */
  color: rgba(255,255,255,0.3);  /* 時間顏色透明度，比日期更淡 */
  letter-spacing: 0.12em;
}

.card-back .back-divider {
  width: 24px;            /* 分隔線寬度 */
  height: 1px;
  background: rgba(255,255,255,0.1);  /* 分隔線顏色，改大會更明顯 */
}

.card-back .back-caption {
  font-size: 11px;        /* 貼文文案字體大小 */
  color: rgba(255,255,255,0.25);  /* 文案顏色透明度，最淡的元素 */
  text-align: center;
  line-height: 1.7;
  font-style: italic;
}

/* ── 燈箱（雙擊卡片後的全螢幕放大） ── */
#lightbox {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 999;
  background: rgba(0,0,0,0.92);  /* 燈箱背景透明度，0.92 = 幾乎全黑 */
  align-items: center;
  justify-content: center;
}
#lightbox.open { display: flex; }

#lightbox img {
  max-width: 90vw;        /* 燈箱圖片最大寬度，佔視窗 90% */
  max-height: 90vh;       /* 燈箱圖片最大高度，佔視窗 90% */
  object-fit: contain;
  border-radius: 4px;
  box-shadow: 0 20px 80px rgba(0,0,0,0.8);
}

#lightbox-close {
  position: fixed;
  top: 20px;
  right: 20px;
  background: none;
  border: none;
  color: rgba(255,255,255,0.3);  /* 關閉按鈕顏色，改大更明顯 */
  font-size: 24px;
  cursor: pointer;
  transition: color 0.2s;
}
#lightbox-close:hover { color: rgba(255,255,255,0.8); }

/* ── 新卡進場動畫（裝置新上傳照片時播放） ── */
@keyframes cardEnter {
  from { opacity: 0; transform: translateY(30px) scale(0.92); }
  to   { opacity: 1; transform: translateY(0)    scale(1); }
  /* translateY(30px) = 從下方 30px 滑入，scale(0.92) = 從小放大 */
}
</style>
</head>
<body>

<canvas id="particles"></canvas>
<div id="stage"></div>
<div id="brand">LETHE</div>

<div id="lightbox" onclick="closeLightbox(event)">
  <button id="lightbox-close" onclick="closeLightbox()">✕</button>
  <img id="lightbox-img" src="" alt="">
</div>

<script>
// ══════════════════════════════════════════════════════════
// 粒子系統
// ══════════════════════════════════════════════════════════
const canvas = document.getElementById('particles');
const ctx    = canvas.getContext('2d');
let W, H, particles = [];

function resizeCanvas() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

function makeParticle() {
  return {
    x:       Math.random() * W,
    y:       Math.random() * H + H,  // 從畫面下方開始往上飄
    size:    Math.random() * 1.2 + 0.3,   // 粒子大小：0.3 ~ 1.5px
                                           // 想要大一點改成 Math.random() * 2.5 + 0.5
                                           // 想要小一點改成 Math.random() * 0.8 + 0.2
    speed:   Math.random() * 0.18 + 0.04, // 上飄速度：0.04 ~ 0.22 px/幀
                                           // 改大粒子飄得更快，改小更慢
    opacity: Math.random() * 0.3 + 0.05,  // 透明度：0.05 ~ 0.35
                                           // 想要更明顯改成 Math.random() * 0.5 + 0.1
                                           // 想要更隱蔽改成 Math.random() * 0.15 + 0.03
    drift:   (Math.random() - 0.5) * 0.15, // 左右漂移幅度，改大粒子會飄得更歪
  };
}

// 粒子數量：45 顆
// 想要更多改成 80、100；想要更少改成 20、30
for (let i = 0; i < 45; i++) {
  const p = makeParticle();
  p.y = Math.random() * H;  // 初始位置分散在整個畫面（不全從下方開始）
  particles.push(p);
}

function tickParticles() {
  ctx.clearRect(0, 0, W, H);
  particles.forEach((p, i) => {
    p.y -= p.speed;   // 往上移動
    p.x += p.drift;   // 左右微微漂移
    if (p.y < -10) {
      particles[i] = makeParticle();  // 飄出畫面頂部後從底部重新生成
    }
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${p.opacity})`;
    ctx.fill();
  });
  requestAnimationFrame(tickParticles);
}
tickParticles();

// ══════════════════════════════════════════════════════════
// 卡片相關
// ══════════════════════════════════════════════════════════
let photos    = [];
let lastCount = 0;
const stage   = document.getElementById('stage');
const cardStates = new Map();  // 儲存每張卡片的漂浮動畫狀態

function parseTime(timeStr) {
  // 把 "2026-03-10 03:42" 解析成日期和時間字串
  const [datePart, timePart] = timeStr.split(' ');
  const [y, m, d] = datePart.split('-');
  const weekdays = ['日','一','二','三','四','五','六'];
  const dow = weekdays[new Date(`${datePart}T${timePart}`).getDay()];
  return {
    date: `${y}\n${m} / ${d}\n週${dow}`,
    time: timePart,
    dateFlat: `${y} · ${m}/${d} · 週${dow}`
  };
}

function createCard(p, index, animate) {
  // ── 卡片尺寸 ──────────────────────────────────────────
  const CARD_W = 130;   // 卡片寬度（px），改大卡片變寬
  const CARD_H = 195;   // 卡片高度（px），改大卡片變高
                        // 小卡比例約 2:3，維持這個比例比較好看

  // ── 散落範圍 ──────────────────────────────────────────
  const margin = 60;    // 卡片距離螢幕邊緣的最小距離（px）
                        // 改小卡片可以散到更邊緣，改大卡片會集中在中間
  const x = margin + Math.random() * (window.innerWidth  - CARD_W - margin * 2);
  const y = margin + Math.random() * (window.innerHeight - CARD_H - margin * 2);

  const ts = parseTime(p.time);

  const wrap = document.createElement('div');
  wrap.className = 'card-wrap';
  wrap.style.width  = CARD_W + 'px';
  wrap.style.height = CARD_H + 'px';
  wrap.style.left   = x + 'px';
  wrap.style.top    = y + 'px';
  wrap.style.zIndex = Math.floor(Math.random() * 10) + 1;  // 隨機層疊順序，讓卡片看起來有前後感

  // 初始旋轉角度：-5 ~ +5 度（隨機略微傾斜）
  // 改成 *20 角度範圍 -10 ~ +10；改成 *0 全部直立
  wrap.style.transform = `rotate(${(Math.random()-0.5)*10}deg)`;

  if (animate) {
    // 新照片上傳時的進場動畫
    wrap.style.animation = 'cardEnter 0.6s ease forwards';  // 0.6s = 動畫秒數
  }

  const inner = document.createElement('div');
  inner.className = 'card-inner';

  // 正面
  const front = document.createElement('div');
  front.className = 'card-front';
  const img = document.createElement('img');
  img.src = p.src;
  img.alt = '';
  img.loading = 'lazy';  // 懶加載：卡片不在視窗內時不載入圖片，節省流量
  front.appendChild(img);
  const shimmer = document.createElement('div');
  shimmer.className = 'card-shimmer';
  front.appendChild(shimmer);

  // 背面
  const back = document.createElement('div');
  back.className = 'card-back';
  back.innerHTML = `
    <div class="back-label">recorded at</div>
    <div class="back-date">${ts.date.replace(/\n/g,'<br>')}</div>
    <div class="back-time">${ts.time}</div>
    <div class="back-divider"></div>
    <div class="back-caption">${p.caption || '—'}</div>
  `;

  inner.appendChild(front);
  inner.appendChild(back);
  wrap.appendChild(inner);
  stage.appendChild(wrap);

  // ── 點擊互動 ──────────────────────────────────────────
  // 單擊翻面；雙擊開燈箱放大
  let clickTimer = null;
  wrap.addEventListener('click', (e) => {
    e.stopPropagation();
    if (clickTimer) {
      clearTimeout(clickTimer);
      clickTimer = null;
      openLightbox(p.src);   // 雙擊：開燈箱
    } else {
      clickTimer = setTimeout(() => {
        clickTimer = null;
        wrap.classList.toggle('flipped');  // 單擊：翻面
      }, 220);  // 220ms 內的第二次點擊算雙擊，改小對雙擊更敏感
    }
  });

  // ── 漂浮動畫參數 ──────────────────────────────────────
  const state = {
    el: wrap,
    baseX: x,
    baseY: y,
    baseRot: (Math.random()-0.5)*10,   // 基礎旋轉角度（同上方的初始傾斜）
    phase:  Math.random() * Math.PI * 2,   // 漂浮相位（讓每張卡片的漂浮節奏錯開）
    phaseY: Math.random() * Math.PI * 2,
    ampX: 3 + Math.random() * 4,   // 左右漂浮幅度：3 ~ 7px，改大卡片飄得更誇張
    ampY: 4 + Math.random() * 5,   // 上下漂浮幅度：4 ~ 9px，改大卡片飄得更誇張
    speed: 0.0004 + Math.random() * 0.0003,  // 漂浮速度，改大飄得更快
  };
  cardStates.set(wrap, state);
}

// ══════════════════════════════════════════════════════════
// 漂浮動畫（每幀更新所有卡片的位置）
// ══════════════════════════════════════════════════════════
function tickFloat(ts) {
  cardStates.forEach((s) => {
    const dx  = Math.sin(ts * s.speed + s.phase)          * s.ampX;  // 左右位移
    const dy  = Math.cos(ts * s.speed + s.phaseY)         * s.ampY;  // 上下位移
    const rot = s.baseRot + Math.sin(ts * s.speed * 0.7 + s.phase) * 1.5;  // 旋轉微微晃動，1.5 = 晃動幅度（度）
    s.el.style.transform = `translate(${dx}px, ${dy}px) rotate(${rot}deg)`;
  });
  requestAnimationFrame(tickFloat);
}
requestAnimationFrame(tickFloat);

// ══════════════════════════════════════════════════════════
// 燈箱（雙擊卡片後的全螢幕放大）
// ══════════════════════════════════════════════════════════
function openLightbox(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeLightbox(e) {
  if (e && e.target !== document.getElementById('lightbox') &&
      e.target !== document.getElementById('lightbox-close')) return;
  document.getElementById('lightbox').classList.remove('open');
  document.body.style.overflow = '';
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeLightbox();  // 按 Esc 關閉燈箱
});

// ══════════════════════════════════════════════════════════
// 渲染所有照片
// ══════════════════════════════════════════════════════════
function renderAll() {
  stage.innerHTML = '';
  cardStates.clear();
  photos.forEach((p, i) => createCard(p, i, false));
}

// ══════════════════════════════════════════════════════════
// 後端輪詢（每 5 秒向 server.py 詢問有沒有新照片）
// ══════════════════════════════════════════════════════════
async function poll() {
  try {
    const data = await fetch('/api/photos').then(r => r.json());
    if (data.length > lastCount) {
      // 有新照片：取得新增的部分，建立新卡片飄進來
      const newPhotos = data.slice(0, data.length - lastCount);
      newPhotos.forEach(p => {
        photos.unshift(p);
        createCard(p, 0, true);  // true = 播放進場動畫
      });
      lastCount = data.length;
    }
  } catch(e) {
    // 後端未啟動時靜默處理，不顯示錯誤
  }
}

// 初始載入：網站打開時從後端取得所有照片
(async () => {
  try {
    photos    = await fetch('/api/photos').then(r => r.json());
    lastCount = photos.length;
    renderAll();
  } catch(e) {
    // 後端尚未啟動，顯示空虛空（不會出錯）
  }
})();

setInterval(poll, 5000);  // 5000ms = 5 秒輪詢一次，改小更即時但消耗更多資源
</script>
</body>
</html>
